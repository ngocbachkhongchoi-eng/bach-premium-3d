# Render Blueprint: website + backend trong một Web Service.
# Mặc định thử nghiệm MIỄN PHÍ, sẽ ngủ khi không có truy cập.
# Muốn hoạt động liên tục: đổi plan thành 0.5c-512mb (có phí),
# hoặc nâng cấp trực tiếp trong Dashboard Render sau khi thử nghiệm.
services:
  - type: web
    name: bach-premium-3d
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: JSONBIN_KEY_TYPE
        value: access
      - key: JSONBIN_BIN_ID
        sync: false
      - key: JSONBIN_API_KEY
        sync: false
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
